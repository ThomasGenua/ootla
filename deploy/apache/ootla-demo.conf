# Replace demo.example.com; provision its TLS certificate before enabling this file.
# Prepared template only. Run apache2ctl configtest on the actual authorized VPS.
<VirtualHost *:80>
    ServerName demo.example.com
    Redirect permanent / https://demo.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName demo.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/demo.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/demo.example.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    # Apache and Ootla must run on the SAME host for this trust configuration.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3100/ connectiontimeout=5 timeout=90
    ProxyPassReverse / http://127.0.0.1:3100/

    Header always set X-Robots-Tag "noindex, nofollow"
    ErrorLog ${APACHE_LOG_DIR}/ootla-demo-error.log
    # %U omits OAuth query parameters. Omit Referer, cookies and Authorization too.
    # Configure retention and operator access for these IP-address-bearing logs.
    LogFormat "%a %t \"%m %U %H\" %>s %b %D" ootla_private_request
    CustomLog ${APACHE_LOG_DIR}/ootla-demo-access.log ootla_private_request
</VirtualHost>